name: Deploy static tools to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage static tools
        run: |
          mkdir -p _site/io-tool _site/stub
          cp index.html esp32-viewer.html flasher.html chips.js flasher.js esp32-parser.js _site/
          cp -R io-tool/. _site/io-tool/
          cp stub/protocol.js stub/targets.js _site/stub/
          for chip in stub/*/; do
            if [ -f "${chip}stub.json" ]; then
              mkdir -p "_site/${chip}"
              cp "${chip}stub.json" "${chip}target.json" "_site/${chip}"
            fi
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
